name: Build and Push Multi-arch iamgio/quarkdown:1.14.1
on:
  push:
    branches:
      - 'main'
    paths:
      - '.github/workflows/iamgio_quarkdown:1.14.1.yml'

jobs:
  build-multi-arch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.ACCESS_TOKEN }}

      - name: Clone quarkdown repository
        run: |
          cd /tmp
          rm -rf quarkdown
          git clone --depth 1 --branch 1.14.1 https://github.com/iamgio/quarkdown.git

      - name: Build and push multi-arch image
        run: |
          cd /tmp/quarkdown
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            -t ghcr.io/packages-mirror/iamgio/quarkdown:1.14.1 \
            -f Dockerfile \
            . \
            --push
